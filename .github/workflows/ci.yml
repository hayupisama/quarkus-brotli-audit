name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.8", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests (stdlib)
        run: python tests/test_brotli_audit.py

  self-audit:
    name: Auto-audit (informational)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ce dépôt n'est pas une app Quarkus : l'auto-audit sert uniquement à vérifier que l'outil
      # s'exécute et produit ses rapports. Il ne fait pas échouer le build (continue-on-error).
      - name: Run tool against itself (smoke test)
        continue-on-error: true
        run: python brotli_audit.py . --out-dir target
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brotli-audit-reports
          path: target/brotli-security-audit.*
          if-no-files-found: ignore
